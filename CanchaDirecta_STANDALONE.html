  function reset(){db=base();save();return db;}
  function get(){return db;}
  function uid(prefix='id'){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);}
  save();
  window.CDStore={get,save,reset,uid,day,localISO};

function footer(){return `<footer class="footer"><div class="container footer-main"><div class="footer-brand"><div class="brand">${logo()}</div><p>La plataforma donde tus ganas de jugar encuentran su lugar.</p></div><div><strong>Explora</strong><button data-action="go-explore">Buscar canchas</button><button data-action="go-events">Actividades</button><button data-action="how">Cómo funciona</button></div><div><strong>Plataforma</strong><button data-action="portal-cliente">Mi cuenta</button><button data-action="owner-portal">Para propietarios</button><button data-action="reset">Restaurar demo</button></div><div><strong>Ayuda</strong><span>soporte@canchadirecta.demo</span><span>Lima, Perú</span><span>Pagos simulados</span></div></div><div class="container footer-bottom">© ${new Date().getFullYear()} CanchaDirecta · Prototipo funcional de frontend <span>HTML + CSS + JavaScript puro</span></div></footer>`;}
function eventCard(e){const v=venue(e.venueId),left=e.places-e.enrolled;return `<article class="event-card"><div class="event-top"><span>${esc(e.type)}</span><span>${icon('calendar',15)} ${pretty(e.date)}</span></div><div class="event-sport">${esc(e.sport)}</div><h3>${esc(e.name)}</h3><p>${icon('pin',15)} ${esc(v?.name)} · ${esc(e.time)}</p><div class="event-progress"><div style="width:${Math.min(100,e.enrolled/e.places*100)}%"></div></div><div class="event-footer"><div><strong>${shortMoney(e.price)}</strong><small>${left} cupos disponibles</small></div><button class="btn btn-small btn-outline" data-action="event-detail" data-id="${e.id}">Ver actividad ${icon('arrow',15)}</button></div></article>`;}
function explore(){const ds=['Todos',...new Set(active().map(x=>x.district))];let venues=active().filter(v=>(state.sport==='Todos'||v.sports.includes(state.sport))&&(state.district==='Todos'||v.district===state.district)&&(`${v.name} ${v.district} ${v.sports.join(' ')}`.toLowerCase().includes(state.search.toLowerCase())));if(state.sort==='precio')venues.sort((a,b)=>Math.min(...csOf(a.id).map(x=>x.price))-Math.min(...csOf(b.id).map(x=>x.price)));if(state.sort==='valorados')venues.sort((a,b)=>b.rating-a.rating);return `<section class="inner-hero"><div class="container"><div class="eyebrow light">EXPLORA · RESERVA · JUEGA</div><h1>Tu próxima cancha<br><em>te está esperando.</em></h1><p>Compara espacios verificados, encuentra tu horario ideal y sal a jugar.</p></div></section><div class="container catalog-layout"><aside class="filter-panel"><h3>${icon('filter')} Filtros</h3>${input('search','Buscar por nombre',state.search,'search','data-filter="search" placeholder="Nombre o zona"')}${select('sport','Deporte',sports,state.sport,'data-filter="sport"')}${select('district','Distrito',ds,state.district,'data-filter="district"')}<button class="text-btn" data-action="clear-filters">Limpiar filtros ${icon('close',15)}</button><div class="filter-tip">${icon('shield',23)}<strong>Espacios verificados</strong><p>Consulta los detalles y reserva con un proceso guiado.</p></div></aside><div class="catalog-results"><div class="catalog-top"><div><small>RESULTADOS DISPONIBLES</small><h2>${venues.length} espacios encontrados</h2></div>${select('sort','Ordenar por',[['recomendados','Destacados'],['precio','Menor precio'],['valorados','Mejor valoración']],state.sort,'data-filter="sort"')}</div>${venues.length?`<div class="venue-grid">${venues.map(venueCard).join('')}</div>`:empty('No encontramos espacios','Prueba con otro deporte o distrito.',button('Limpiar filtros','clear-filters'))}</div></div>${footer()}`;}
function slotsFor(c,d,duration){const output=[];const open=minutes(c.open),close=minutes(c.close);for(let m=open;m+duration<=close;m+=30){if(m%30)continue;const stop=m+duration;let blocked=db.blocks.some(b=>b.courtId===c.id&&b.date===d&&m<minutes(b.end)&&stop>minutes(b.start));let reserved=db.bookings.some(b=>b.courtId===c.id&&b.date===d&&['confirmada','pendiente'].includes(b.status)&&m<minutes(b.start)+b.duration&&stop>minutes(b.start));const isPast=d===day()&&m<=new Date().getHours()*60+new Date().getMinutes();output.push({time:hour(m),free:!(blocked||reserved||isPast)});}return output;}
function rate(c,date,start='',duration=60){let base=c.price*(duration/60);const d=new Date(`${date}T12:00:00`),weekend=[0,6].includes(d.getDay()),peak=start&&minutes(start)>=18*60;return Math.round(base*(weekend?1.12:1)*(peak?1.25:1));}
function getDiscount(total){const cp=db.coupons.find(x=>x.code.toUpperCase()===state.coupon.trim().toUpperCase()&&x.active&&x.uses<x.limit);return cp?Math.min(total,cp.type==='porcentaje'?Math.round(total*cp.value/100):cp.value):0;}
function venueDetails(){const v=venue(state.venue);if(!v||v.status!=='activo')return explore();const cs=csOf(v.id).filter(x=>x.status==='activo');if(!cs.some(x=>x.id===state.court)){state.court=cs[0]?.id||'';state.slot='';}const c=court(state.court),times=c?slotsFor(c,state.date,state.duration):[];const selected=times.find(x=>x.time===state.slot&&x.free);return `<div class="container detail-breadcrumb"><button data-action="go-explore">Espacios</button>${icon('chevron',14)}<span>${esc(v.name)}</span></div><div class="container detail-page"><div class="detail-heading"><div><div class="eyebrow">ESPACIO DEPORTIVO VERIFICADO</div><h1>${esc(v.name)}</h1><p>${icon('pin',16)} ${esc(v.address)}</p></div><div class="detail-rating">${icon('star',19)} <strong>${v.rating}</strong> <span>${v.reviews} opiniones</span></div></div><div class="detail-art">${venueVisual(v,'detail-visual')}<div class="detail-art-overlay"><span>${v.sports.map(esc).join(' · ')}</span><strong>ESPACIOS HECHOS PARA JUGAR</strong></div></div><div class="detail-columns"><div class="detail-left"><section class="detail-section"><h2>Sobre este espacio</h2><p>${esc(v.description)}</p><div class="details-stats"><div>${icon('ball')}<b>${cs.length}</b><span>Espacios</span></div><div>${icon('star')}<b>${v.rating}</b><span>Valoración</span></div><div>${icon('clock')}<b>${cs[0]?.open||'07:00'}</b><span>Apertura</span></div></div></section><section class="detail-section"><h2>Servicios incluidos</h2><div class="amenity-list">${v.amenities.map(x=>`<div>${icon('check',15)} ${esc(x)}</div>`).join('')}</div></section><section class="detail-section"><h2>Nuestras canchas</h2><div class="court-options">${cs.map(x=>`<button class="court-option ${x.id===state.court?'active':''}" data-action="choose-court" data-id="${x.id}"><span class="court-symbol">${icon('ball',21)}</span><span><strong>${esc(x.name)}</strong><small>${esc(x.sport)} · ${x.capacity} jugadores · ${x.indoor?'Techada':'Aire libre'}</small></span><b>desde ${shortMoney(x.price)}/h</b></button>`).join('')}</div></section><section class="detail-section"><h2>Lo que opinan los jugadores</h2>${db.reviews.filter(x=>x.venueId===v.id).map(x=>`<div class="review"><div class="review-avatar">${username(x.userId).slice(0,1)}</div><div><div><strong>${esc(username(x.userId))}</strong> <span class="stars">${'★'.repeat(x.rating)}</span></div><small>${pretty(x.date)}</small><p>${esc(x.comment)}</p></div></div>`).join('')||'<p class="muted">Todavía no hay reseñas.</p>'}</section></div><aside class="booking-widget"><div class="widget-kicker">RESERVA ONLINE</div><h3>Selecciona tu horario</h3>${select('court','Espacio',cs.map(x=>[x.id,`${x.name} · ${x.sport}`]),state.court,'data-book="court"')}${input('date','Fecha',state.date,'date',`min="${day()}" max="${day(db.settings.maxAdvance)}" data-book="date"`)}${select('duration','Duración',[[60,'1 hora'],[90,'1 h 30 min'],[120,'2 horas']],state.duration,'data-book="duration"')}<span class="field-label">Horarios disponibles</span><div class="slots-grid">${times.filter((x,i)=>i%2===0).map(x=>`<button class="slot ${state.slot===x.time?'active':''}" data-action="choose-slot" data-time="${x.time}" ${!x.free?'disabled':''}>${x.time}</button>`).join('')}</div><div class="slot-legend"><span><i class="available-dot"></i> Disponible</span><span><i class="blocked-dot"></i> Ocupado</span></div><div class="widget-total"><div><span>Total estimado</span><small>${state.duration} min · tarifas ajustadas por horario</small></div><strong>${selected?money(rate(c,state.date,state.slot,state.duration)):'—'}</strong></div><button class="btn btn-primary btn-full" data-action="continue-booking" ${!selected?'disabled':''}>Continuar reserva ${icon('arrow',17)}</button><div class="booking-safe">${icon('shield',17)} Sin pago real en la demostración</div></aside></div></div>${footer()}`;}
function checkout(){const c=court(state.court),v=venue(state.venue),found=c&&slotsFor(c,state.date,state.duration).some(x=>x.time===state.slot&&x.free);if(!found)return venueDetails();const subtotal=rate(c,state.date,state.slot,state.duration),discount=getDiscount(subtotal),total=subtotal-discount;return `<div class="checkout-bg"><div class="container checkout-shell"><div class="checkout-heading"><button class="text-btn" data-action="back-detail">← Volver a los horarios</button><div class="eyebrow">PASO 02 / 03 · CONFIRMACIÓN</div><h1>Solo falta <em>confirmar.</em></h1><p>Revisa los detalles y elige cómo registrar el pago.</p></div><div class="checkout-grid"><div class="checkout-form"><section class="panel"><h3>01. Datos del jugador</h3><p>La reserva se registrará a nombre de la cuenta demo.</p>${input('guest','Nombre y apellido',db.users.find(x=>x.id==='u1')?.name||'Alex Rivera','text','required')}${input('phone','Celular',db.users.find(x=>x.id==='u1')?.phone||'987654321','tel','required')}</section><section class="panel"><h3>02. Método de pago</h3><p>Estas opciones son una simulación visual: no se realiza ningún cargo.</p><div class="payment-methods">${['Yape','Plin','Tarjeta','Efectivo'].map(x=>`<button type="button" class="payment-choice ${state.method===x?'active':''}" data-action="set-method" data-method="${x}"><span>${x==='Yape'?'Y':x==='Plin'?'P':x==='Tarjeta'?'▣':'S/'}</span><b>${x}</b>${state.method===x?icon('check',17):''}</button>`).join('')}</div><div class="demo-notice">${icon('lock',18)} ${state.method==='Efectivo'?'El pago quedará pendiente para recepción.':'Pago registrado como simulado; no se solicitan datos bancarios.'}</div></section><section class="panel"><h3>03. Código promocional</h3><div class="coupon-box"><input name="coupon" id="coupon" placeholder="Ej. PRIMERPARTIDO" value="${esc(state.coupon)}"><button class="btn btn-outline" data-action="apply-coupon">Aplicar</button></div><small class="muted">Prueba PRIMERPARTIDO o JUEGA10</small></section><button class="btn btn-primary btn-full btn-large" data-action="confirm-booking">Confirmar reserva · ${money(total)} ${icon('arrow',18)}</button><p class="checkout-consent">Al confirmar aceptas las condiciones de cancelación de la demostración.</p></div><aside class="checkout-summary"><div class="summary-image">${venueVisual(v)}</div><h3>${esc(v?.name)}</h3><p>${icon('pin',15)} ${esc(v?.district)}</p><div class="summary-line"><span>Cancha</span><strong>${esc(c.name)}</strong></div><div class="summary-line"><span>Fecha</span><strong>${pretty(state.date)}</strong></div><div class="summary-line"><span>Horario</span><strong>${state.slot} · ${state.duration} min</strong></div><hr><div class="summary-line"><span>Subtotal</span><strong>${money(subtotal)}</strong></div>${discount?`<div class="summary-line discount"><span>Descuento</span><strong>− ${money(discount)}</strong></div>`:''}<div class="summary-total"><span>Total</span><strong>${money(total)}</strong></div><div class="summary-note">${icon('shield',18)} Reserva comprobada contra solapamientos</div></aside></div></div></div>`;}
function bookingSuccess(){const b=db.bookings.find(x=>x.id===state.selectedPayment);if(!b)return home();return `<section class="success-page"><div class="success-icon">${icon('check',41)}</div><div class="eyebrow">PASO 03 / 03 · LISTO</div><h1>¡Tu cancha <em>te espera!</em></h1><p>Hemos registrado tu reserva de demostración. Puedes consultarla desde tu panel de cliente.</p><div class="success-ticket"><span>RESERVA CONFIRMADA</span><strong>${esc(b.id)}</strong><div>${icon('pin',18)} ${esc(venue(b.venueId)?.name)} · ${esc(court(b.courtId)?.name)}</div><div>${icon('calendar',18)} ${pretty(b.date)} a las ${b.start}</div><div>${icon('credit',18)} ${esc(b.method)} · ${money(b.total)}</div>${chip(b.status)}</div><div class="success-actions">${button('Ver mis reservas','portal-bookings')}${button('Seguir explorando','go-explore','outline')}</div><p class="muted">Este comprobante no representa una operación bancaria real.</p></section>${footer()}`;}

function publicContent(){return state.page==='explorar'?explore():state.page==='detalle'?venueDetails():state.page==='checkout'?checkout():state.page==='confirmacion'?bookingSuccess():state.page==='eventos'?eventsPage():state.page==='como-funciona'?aboutPage():home();}

function upcoming(b){return `<div class="upcoming-booking"><div class="upcoming-icon">${icon('calendar',23)}</div><div><small>${pretty(b.date)} · ${esc(b.start)}</small><strong>${esc(venue(b.venueId)?.name)}</strong><span>${esc(court(b.courtId)?.name)}</span></div>${chip(b.status)}<button class="btn btn-outline btn-small" data-action="booking-options" data-id="${b.id}">Detalles</button></div>`;}
function clientContent(){const my=db.bookings.filter(x=>x.userId==='u1').sort((a,b)=>b.date.localeCompare(a.date));const next=my.filter(x=>x.date>=day()&&x.status==='confirmada').sort((a,b)=>a.date.localeCompare(b.date));if(state.page==='resumen')return `${dashboardIntro('¡Hola, Alex! 👋','Organiza tus próximos partidos, explora nuevos espacios y mantente al día.',button('Reservar una cancha '+icon('arrow',17),'go-explore'))}<div class="stats-grid">${stat('Próximas reservas',next.length,'Partidos programados','calendar')}${stat('Partidos jugados',my.filter(x=>x.status==='completada').length,'Historial de juego','ball')}${stat('Espacios favoritos',db.favorites.length,'Siempre a tu alcance','heart')}${stat('Gasto registrado',money(sum(my.filter(x=>x.payment==='pagado'),b=>b.total)),'Operaciones de demostración','wallet')}</div><div class="dashboard-two">${panel('Tus próximos partidos',next.length?next.map(upcoming).join(''):empty('Sin reservas pendientes','Explora espacios y agenda tu siguiente partido.',button('Buscar espacios','go-explore')),button('Ver todas '+icon('arrow',15),'client-bookings','ghost'))}${panel('Accesos rápidos',`<div class="quick-actions">${[['search','Buscar canchas','go-explore'],['heart','Mis favoritos','client-favorites'],['ticket','Unirme a actividades','go-events'],['help','Pedir ayuda','client-support']].map(x=>`<button data-action="${x[2]}">${icon(x[0],22)}<span>${x[1]}</span>${icon('chevron',16)}</button>`).join('')}</div>`)}</div>`;
if(state.page==='mis-reservas')return `${dashboardIntro('Mis reservas','Gestiona próximas visitas, cancelaciones e historial.',button('Nueva reserva '+icon('plus',16),'go-explore'))}<div class="panel filter-row"><div class="segmented">${[['todas','Todas'],['proximas','Próximas'],['historial','Historial']].map(([k,v])=>`<button class="${state.bookFilter===k?'active':''}" data-action="booking-filter" data-filter="${k}">${v}</button>`).join('')}</div></div>${panel('Historial de reservas',table(['Código / cliente','Sede / cancha','Fecha / horario','Importe','Estado','Acciones'],my.filter(b=>state.bookFilter==='todas'||(state.bookFilter==='proximas'?b.date>=day()&&b.status==='confirmada':b.date<day()||b.status!=='confirmada')).map(b=>bookingRow(b)).join('')))}`;
if(state.page==='favoritos')return `${dashboardIntro('Mis favoritos','Tus lugares preferidos, siempre a un clic.')}${db.favorites.length?`<div class="venue-grid portal-venue-grid">${db.favorites.map(venue).filter(Boolean).map(venueCard).join('')}</div>`:empty('Aún no tienes favoritos','Guarda los espacios que más te gustan.',button('Explorar','go-explore'))}`;
if(state.page==='actividades')return `${dashboardIntro('Mis actividades','Participa en eventos deportivos y partidos abiertos.',button('Explorar actividades','go-events'))}<div class="events-grid">${db.events.map(eventCard).join('')}</div>${panel('Mis inscripciones',db.enrollments.filter(x=>x.userId==='u1').map(x=>`<div class="record-line">${esc(db.events.find(e=>e.id===x.eventId)?.name||'Actividad')} ${chip('confirmada')}</div>`).join('')||empty('Sin inscripciones','Únete a tu primera actividad.'))}`;
if(state.page==='billetera')return `${dashboardIntro('Pagos y saldo','Consulta registros de cobros simulados.')}<div class="stats-grid two-stats">${stat('Saldo de cortesía',money(db.balance),'Saldo ficticio para demo','wallet')}${stat('Total pagado',money(sum(my.filter(x=>x.payment==='pagado'),b=>b.total)),'Reservas registradas como pagadas','credit')}</div>${panel('Movimientos de reservas',table(['Código','Espacio','Fecha','Monto','Estado'],my.map(b=>`<tr><td class="code">${b.id}</td><td>${esc(venue(b.venueId)?.name)}</td><td>${pretty(b.date)}</td><td>${money(b.total)}</td><td>${chip(b.payment)}</td></tr>`).join('')))}`;
if(state.page==='notificaciones'){const ns=db.notifications.filter(x=>x.userId==='u1');return `${dashboardIntro('Notificaciones','Cambios de estado, recordatorios y avisos.',button('Marcar como leídas','read-all'))}${panel('Centro de notificaciones',ns.map(n=>`<div class="notice ${n.read?'read':''}"><div>${icon('bell',19)}</div><article><strong>${esc(n.title)}</strong><p>${esc(n.body)}</p><small>${pretty(n.date)}</small></article>${!n.read?'<span class="notice-dot"></span>':''}</div>`).join('')||empty('Sin notificaciones','Aquí aparecerán tus próximas novedades.'))}`;}
if(state.page==='soporte')return `${dashboardIntro('Centro de ayuda','Gestiona consultas y problemas relacionados con reservas.',button('Crear consulta '+icon('plus',16),'new-ticket'))}${supportTable('u1')}`;

function calendarAgenda(who){const cs=db.courts.filter(c=>owned().some(v=>v.id===c.venueId)&&c.status==='activo'),bookings=scoped().filter(b=>b.date===state.agendaDate&&b.status!=='cancelada');return `${panel('Agenda del '+pretty(state.agendaDate),`<div class="agenda-toolbar">${input('agenda','Selecciona fecha',state.agendaDate,'date','data-agenda="date"')}<div class="agenda-key"><span><i class="key-confirmed"></i> Reserva</span><span><i class="key-block"></i> Bloqueado</span></div></div><div class="agenda-grid"><div class="agenda-head">ESPACIO</div>${Array.from({length:8},(_,i)=>`<div class="agenda-head">${pad(i+14)}:00</div>`).join('')}${cs.map(c=>`<div class="agenda-name"><strong>${esc(c.name)}</strong><small>${esc(venue(c.venueId)?.name)}</small></div>${Array.from({length:8},(_,i)=>{const start=(i+14)*60,end=start+60,booking=bookings.find(b=>b.courtId===c.id&&start<minutes(b.start)+b.duration&&end>minutes(b.start)),blocked=db.blocks.find(x=>x.courtId===c.id&&x.date===state.agendaDate&&start<minutes(x.end)&&end>minutes(x.start));return `<button class="agenda-cell ${booking?'booked':blocked?'blocked':''}" ${booking?`data-action="booking-options" data-id="${booking.id}"`:''} ${!booking&&!blocked?`data-action="agenda-book" data-id="${c.id}" data-time="${hour(start)}"`:''}>${booking?`<b>${esc(booking.guest.split(' ')[0])}</b><small>${esc(booking.id)}</small>`:blocked?`<b>Mantenimiento</b>`:'+'}</button>`}).join('')}`).join('')}</div><p class="muted agenda-footnote">Franjas de 60 minutos para visualización. El motor de reservas comprueba intervalos reales, incluso reservas de 90 y 120 minutos.</p>`)}`;}

function makeReservation({courtId,date,start,duration,guest,method,payment,userId,source}){const c=court(courtId);if(!c||c.status!=='activo'||venue(c.venueId)?.status!=='activo')return {error:'El espacio no está habilitado.'};if(date<day()||date>day(db.settings.maxAdvance))return {error:'La fecha no está dentro del rango permitido.'};duration=Number(duration);if(!slotsFor(c,date,duration).some(x=>x.time===start&&x.free))return {error:'El horario no está disponible o se cruza con otra reserva.'};const base=rate(c,date,start,duration),discount=source==='web'?getDiscount(base):0;let id='R-'+String(Math.max(1050,...db.bookings.map(x=>Number(x.id.replace(/\D/g,''))||0))+1);let booking={id,courtId:c.id,venueId:c.venueId,userId:userId||'u1',guest,date,start,duration,price:base,total:base-discount,method,payment,status:'confirmada',source,createdAt:day(),extras:[]};db.bookings.push(booking);if(discount){const cp=db.coupons.find(x=>x.code===state.coupon.trim().toUpperCase());if(cp)cp.uses++;}audit('Reserva creada',`${booking.id} · ${guest} · ${c.name}`);notify('u2','Nueva reserva',`${guest} reservó ${c.name} el ${pretty(date)}.`);if(userId==='u1')notify('u1','Reserva confirmada',`${venue(c.venueId).name} · ${pretty(date)}, ${start}`);persist();return {booking};}
function bookingModal(id){const b=db.bookings.find(x=>x.id===id);if(!b)return;const canCancel=b.status==='confirmada'&&((new Date(`${b.date}T${b.start}:00`)-new Date())/3600000)>=db.settings.cancelHours;const canCheck=b.status==='confirmada'&&['propietario','operador','administrador'].includes(state.role);const canPay=b.payment==='pendiente'&&state.role!=='cliente';openModal(`<div class="modal-kicker">DETALLE DE RESERVA</div><h2>${esc(b.id)}</h2><p class="muted">Información y acciones de la reserva</p><div class="receipt-details">${[['Cliente',b.guest],['Complejo',venue(b.venueId)?.name],['Espacio',court(b.courtId)?.name],['Fecha',pretty(b.date)],['Hora',b.start],['Duración',b.duration+' minutos'],['Método',b.method],['Total',money(b.total)]].map(x=>`<div><span>${esc(x[0])}</span><strong>${esc(x[1])}</strong></div>`).join('')}<div><span>Reserva</span>${chip(b.status)}</div><div><span>Pago</span>${chip(b.payment)}</div></div><div class="modal-actions">${canCheck?button('Marcar check-in','checkin','primary',`data-id="${b.id}"`):''}${canPay?button('Registrar pago','mark-paid','outline',`data-id="${b.id}"`):''}${canCancel?button('Cancelar reserva','cancel-booking','danger',`data-id="${b.id}"`):''}${state.role==='cliente'&&b.status==='completada'?button('Dejar reseña','new-review','outline',`data-id="${b.id}"`):''}${button('Imprimir comprobante','print-receipt','outline',`data-id="${b.id}"`)}</div>${!canCancel&&b.status==='confirmada'?`<small class="muted">Política: cancelaciones hasta ${db.settings.cancelHours} horas antes del turno.</small>`:''}`);}
function entityModal(kind,id){const v=id?venue(id):null,c=id?court(id):null,e=id?db.events.find(x=>x.id===id):null;let content='';if(kind==='venue')content=`<div class="modal-kicker">ADMINISTRACIÓN DE SEDES</div><h2>${v?'Editar sede':'Nueva sede'}</h2><form id="venue-form" class="form-grid" data-id="${id||''}">${input('name','Nombre',v?.name||'','text','required')}${input('district','Distrito',v?.district||'','text','required')}${input('address','Dirección',v?.address||'','text','required')}${select('sport','Deporte principal',sports.slice(1),v?.sports[0]||'Fútbol 7')}${fieldArea('description','Descripción',v?.description||'')}${input('amenities','Servicios (separados por coma)',v?.amenities.join(', ')||'Estacionamiento, Iluminación')}<div class="info-callout">${icon('shield',18)} Las nuevas sedes deben ser aprobadas por la administración de la plataforma.</div><div class="form-footer"><button type="submit" class="btn btn-primary">${v?'Guardar cambios':'Crear sede'}</button></div></form>`;
if(kind==='court')content=`<div class="modal-kicker">ESPACIOS DEPORTIVOS</div><h2>${c?'Editar cancha':'Nueva cancha'}</h2><form id="court-form" class="form-grid" data-id="${id||''}">${select('venueId','Sede',owned().map(x=>[x.id,x.name]),c?.venueId||owned()[0]?.id)}${input('name','Nombre de cancha',c?.name||'','text','required')}${select('sport','Deporte',sports.slice(1),c?.sport||'Fútbol 7')}${input('price','Precio base / hora (S/)',c?.price||100,'number','min="1" max="10000" required')}${input('capacity','Capacidad',c?.capacity||10,'number','min="1" max="200" required')}${select('indoor','Tipo',[[false,'Aire libre'],[true,'Techada']],String(c?.indoor??false))}${select('open','Apertura',Array.from({length:18},(_,i)=>hour((5+i)*60)),c?.open||'07:00')}${select('close','Cierre',Array.from({length:18},(_,i)=>hour((7+i)*60)),c?.close||'23:00')}${select('status','Estado',['activo','inactivo'],c?.status||'activo')}<div class="form-footer"><button type="submit" class="btn btn-primary">Guardar espacio</button></div></form>`;
if(kind==='block')content=`<div class="modal-kicker">CALENDARIO OPERATIVO</div><h2>Bloquear horario</h2><form id="block-form" class="form-grid">${select('courtId','Cancha',db.courts.filter(c=>owned().some(v=>v.id===c.venueId)).map(c=>[c.id,`${venue(c.venueId).name} · ${c.name}`]),'c1')}${input('date','Fecha',day(1),'date',`required min="${day()}"`)}${select('start','Desde',Array.from({length:34},(_,i)=>hour(6*60+i*30)),'14:00')}${select('end','Hasta',Array.from({length:34},(_,i)=>hour(7*60+i*30)),'16:00')}${input('reason','Motivo','Mantenimiento programado','text','required')}<div class="form-footer"><button type="submit" class="btn btn-primary">Crear bloqueo</button></div></form>`;
if(kind==='event')content=`<div class="modal-kicker">COMUNIDAD DEPORTIVA</div><h2>${e?'Editar actividad':'Nueva actividad'}</h2><form id="event-form" class="form-grid" data-id="${id||''}">${input('name','Nombre de actividad',e?.name||'','text','required')}${select('type','Tipo',['Torneo','Clase','Partido abierto'],e?.type||'Torneo')}${select('sport','Deporte',sports.slice(1),e?.sport||'Fútbol 7')}${select('venueId','Sede',db.venues.filter(x=>x.status==='activo').map(x=>[x.id,x.name]),e?.venueId||'v1')}${input('date','Fecha',e?.date||day(7),'date',`required min="${day()}"`)}${input('time','Hora',e?.time||'17:00','time','required')}${input('places','Cupos',e?.places||12,'number','min="1" required')}${input('price','Precio (S/)',e?.price||30,'number','min="0" required')}<div class="form-footer"><button type="submit" class="btn btn-primary">Guardar actividad</button></div></form>`;
if(kind==='coupon')content=`<div class="modal-kicker">MARKETING</div><h2>Crear cupón</h2><form id="coupon-form" class="form-grid">${input('code','Código','','text','required pattern="[A-Za-z0-9_-]{4,30}"')}${select('type','Tipo',[["porcentaje","Descuento porcentual"],["monto","Monto fijo"]])}${input('value','Valor',10,'number','min="1" required')}${input('limit','Máximo de usos',100,'number','min="1" required')}<div class="form-footer"><button type="submit" class="btn btn-primary">Crear cupón</button></div></form>`;
if(kind==='ticket')content=`<div class="modal-kicker">CENTRO DE AYUDA</div><h2>Nueva solicitud</h2><form id="ticket-form" class="form-grid">${input('subject','Asunto','','text','required')}${select('priority','Prioridad',['baja','media','alta'],'media')}${fieldArea('detail','Descripción de la incidencia','')}<div class="form-footer"><button type="submit" class="btn btn-primary">Enviar consulta</button></div></form>`;
openModal(content,true);}
function formValues(form){return Object.fromEntries(new FormData(form).entries());}
function formAction(e){e.preventDefault();const f=e.target,v=formValues(f),id=f.dataset.id;if(f.id==='profile-form'){const u=db.users.find(x=>x.id==='u1');Object.assign(u,{name:v.name.trim(),email:v.email.trim(),phone:v.phone.trim()});persist();toast('Perfil guardado');render();return;}
if(f.id==='settings-form'){Object.assign(db.settings,{commission:+v.commission,cancelHours:+v.cancelHours,maxAdvance:+v.maxAdvance,supportEmail:v.supportEmail});audit('Configuración actualizada','Políticas globales modificadas');render();toast('Configuración guardada');return;}
if(f.id==='venue-form'){if(id){const x=venue(id);Object.assign(x,{name:v.name,district:v.district,address:v.address,sports:[v.sport],description:v.description,amenities:v.amenities.split(',').map(s=>s.trim()).filter(Boolean)});}else{db.venues.push({id:Store.uid('v'),ownerId:'u2',name:v.name,district:v.district,address:v.address,sports:[v.sport],description:v.description,amenities:v.amenities.split(',').map(s=>s.trim()).filter(Boolean),rating:0,reviews:0,verified:false,status:'pendiente',cover:v.sport.includes('Fútbol')?'futbol':v.sport==='Pádel'?'padel':v.sport==='Básquet'?'basquet':v.sport==='Vóley'?'voley':'tenis',featured:false});}audit(id?'Sede modificada':'Sede creada',v.name);closeModal();render();toast('Sede guardada. Las nuevas sedes requieren aprobación.');return;}
if(f.id==='court-form'){if(minutes(v.close)<=minutes(v.open)){toast('El cierre debe ser posterior a la apertura','bad');return;}const obj={venueId:v.venueId,name:v.name,sport:v.sport,price:+v.price,capacity:+v.capacity,indoor:v.indoor==='true',open:v.open,close:v.close,status:v.status};if(id)Object.assign(court(id),obj);else db.courts.push({id:Store.uid('c'),...obj});audit('Espacio guardado',v.name);closeModal();render();toast('Cancha guardada');return;}
if(f.id==='block-form'){const c=court(v.courtId);if(minutes(v.start)>=minutes(v.end)){toast('La hora final debe ser posterior a la inicial','bad');return;}const overlap=db.bookings.some(b=>b.courtId===v.courtId&&b.date===v.date&&b.status==='confirmada'&&minutes(v.start)<minutes(b.start)+b.duration&&minutes(v.end)>minutes(b.start));if(overlap){toast('Hay reservas confirmadas en ese horario. Reprograma antes de bloquear.','bad');return;}db.blocks.push({id:Store.uid('BL'),courtId:c.id,date:v.date,start:v.start,end:v.end,reason:v.reason});audit('Bloqueo creado',`${c.name} · ${pretty(v.date)}`);closeModal();render();toast('Bloqueo registrado');return;}
if(f.id==='event-form'){const o={name:v.name,type:v.type,sport:v.sport,venueId:v.venueId,date:v.date,time:v.time,places:+v.places,price:+v.price};if(id)Object.assign(db.events.find(x=>x.id===id),o);else db.events.push({id:Store.uid('e'),enrolled:0,...o});audit('Actividad guardada',v.name);closeModal();render();toast('Actividad guardada');return;}
if(f.id==='coupon-form'){const code=v.code.trim().toUpperCase();if(db.coupons.some(x=>x.code===code)){toast('El cupón ya existe','bad');return;}if(v.type==='porcentaje'&&+v.value>100){toast('El porcentaje máximo es 100','bad');return;}db.coupons.push({id:Store.uid('p'),code,type:v.type,value:+v.value,uses:0,limit:+v.limit,active:true});audit('Cupón creado',code);closeModal();render();toast('Cupón creado');return;}
if(f.id==='ticket-form'){const t={id:'T-'+(201+db.tickets.length),subject:v.subject,detail:v.detail,priority:v.priority,userId:roleUsers[state.role]||'u1',date:day(),status:'abierto'};db.tickets.push(t);audit('Ticket creado',v.subject);closeModal();render();toast('Solicitud registrada');return;}
if(f.id==='walkin-form'){if(v.guest.trim().length<3){toast('Escribe el nombre del cliente','bad');return;}const res=makeReservation({courtId:v.courtId,date:v.date,start:v.start,duration:Number(v.duration),guest:v.guest.trim(),method:v.payment==='pagado'?'Efectivo':'Efectivo',payment:v.payment,userId:'u5',source:'recepción'});if(res.error){toast(res.error,'bad');return;}toast('Reserva presencial registrada: '+res.booking.id);go('reservas',state.role);return;}
if(f.id==='home-search'){state.sport=v.sport;state.district=v.district;state.date=v.date;go('explorar','public');return;}}
function handleClick(e){if(e.target.closest('.modal')&&!e.target.closest('.modal [data-action],.modal [data-link]'))return;const a=e.target.closest('[data-action],[data-link]');if(!a)return;if(a.tagName==='A')e.preventDefault();const x=a.dataset.action||'',id=a.dataset.id||'',link=a.dataset.link;if(link){go(link,'public');return;}if(x==='close-modal'){closeModal();return;}if(x==='toggle-menu'){state.mobile=!state.mobile;render();return;}if(x==='reset'){reset();return;}if(x==='navigate'){go(a.dataset.page);return;}if(x==='public-home'){go('inicio','public');return;}if(x==='portal-cliente'){go('resumen','cliente');return;}if(x==='portal-bookings'){go('mis-reservas','cliente');return;}if(x==='owner-portal'){go('resumen','propietario');return;}if(x==='go-explore'){state.sport='Todos';state.district='Todos';state.search='';go('explorar','public');return;}if(x==='go-events'){go('eventos','public');return;}if(x==='how'){go('como-funciona','public');return;}if(x==='sport-search'){state.sport=a.dataset.sport;state.district='Todos';state.search='';go('explorar','public');return;}if(x==='view-venue'){state.venue=id;state.court=csOf(id)[0]?.id;state.slot='';state.date=day(1);state.duration=60;go('detalle','public');return;}if(x==='toggle-favorite'){if(db.favorites.includes(id))db.favorites=db.favorites.filter(i=>i!==id);else db.favorites.push(id);persist();render();toast(db.favorites.includes(id)?'Añadido a favoritos':'Eliminado de favoritos');return;}if(x==='clear-filters'){state.sport='Todos';state.district='Todos';state.search='';state.sort='recomendados';render();return;}if(x==='choose-court'){state.court=id;state.slot='';render();return;}if(x==='choose-slot'){state.slot=a.dataset.time;render();return;}if(x==='continue-booking'){if(!state.slot){toast('Selecciona un horario','bad');return;}go('checkout','public');return;}if(x==='back-detail'){go('detalle','public');return;}if(x==='set-method'){state.method=a.dataset.method;render();return;}if(x==='apply-coupon'){state.coupon=$('#coupon')?.value.trim().toUpperCase()||'';if(state.coupon&&!db.coupons.some(c=>c.code===state.coupon&&c.active&&c.uses<c.limit))toast('Cupón no disponible','bad');else toast(state.coupon?'Cupón aplicado':'Cupón retirado');render();return;}
if(x==='confirm-booking'){const guest=$('input[name="guest"]')?.value?.trim(),phone=$('input[name="phone"]')?.value?.trim();if(!guest||!phone){toast('Completa nombre y teléfono','bad');return;}const result=makeReservation({courtId:state.court,date:state.date,start:state.slot,duration:state.duration,guest,method:state.method,payment:state.method==='Efectivo'?'pendiente':'pagado',userId:'u1',source:'web'});if(result.error){toast(result.error,'bad');go('detalle','public');return;}state.selectedPayment=result.booking.id;state.coupon='';go('confirmacion','public');return;}
if(x==='booking-filter'){state.bookFilter=a.dataset.filter;render();return;}if(x==='booking-options'){bookingModal(id);return;}if(x==='cancel-booking'){const b=db.bookings.find(v=>v.id===id);if(!b)return;if(!confirm('¿Cancelar la reserva '+id+'? Se registrará como cancelada.'))return;b.status='cancelada';if(b.payment==='pagado')b.payment='reembolsado';audit('Reserva cancelada',id);closeModal();render();toast('Reserva cancelada');return;}if(x==='checkin'){db.bookings.find(v=>v.id===id).status='completada';audit('Check-in registrado',id);closeModal();render();toast('Check-in registrado');return;}if(x==='mark-paid'){db.bookings.find(v=>v.id===id).payment='pagado';audit('Pago registrado',id);closeModal();render();toast('Cobro marcado como recibido');return;}if(x==='print-receipt'){const b=db.bookings.find(v=>v.id===id);const html=`<!doctype html><html><head><meta charset="utf-8"><title>Reserva ${esc(id)}</title><style>body{font-family:Arial,sans-serif;max-width:550px;margin:40px auto;line-height:1.7;color:#182027}h1{font-size:24px}p{border-bottom:1px solid #ddd;padding-bottom:10px}</style></head><body><h1>CANCHADIRECTA</h1><p>Comprobante de demostración · sin validez tributaria</p><h2>${esc(id)}</h2><p>${esc(venue(b.venueId)?.name)} · ${esc(court(b.courtId)?.name)}</p><p>${pretty(b.date)} · ${esc(b.start)} · ${b.duration} minutos</p><p>${esc(b.guest)} · ${esc(b.method)}</p><h2>Total: ${money(b.total)}</h2><script>window.print()<\/script></body></html>`;const w=window.open('','_blank');if(w){w.document.write(html);w.document.close();}else toast('Habilita ventanas emergentes para imprimir','bad');return;}
if(x==='new-review'){const b=db.bookings.find(x=>x.id===id);openModal(`<div class="modal-kicker">CALIFICA TU EXPERIENCIA</div><h2>${esc(venue(b.venueId)?.name)}</h2><form id="review-form" data-id="${id}">${select('rating','Calificación',[[5,'★★★★★ Excelente'],[4,'★★★★ Buena'],[3,'★★★ Regular'],[2,'★★ Mala'],[1,'★ Muy mala']],5)}${fieldArea('comment','Comentario','')}<div class="form-footer"><button type="submit" class="btn btn-primary">Publicar reseña</button></div></form>`);return;}
if(x==='event-detail'){const ev=db.events.find(z=>z.id===id),left=ev.places-ev.enrolled,joined=db.enrollments.some(z=>z.userId==='u1'&&z.eventId===id);openModal(`<div class="modal-kicker">${esc(ev.type.toUpperCase())}</div><h2>${esc(ev.name)}</h2><p class="muted">${esc(ev.sport)} · ${esc(venue(ev.venueId)?.name)}</p><div class="receipt-details"><div><span>Fecha</span><strong>${pretty(ev.date)}</strong></div><div><span>Inicio</span><strong>${esc(ev.time)}</strong></div><div><span>Inscritos</span><strong>${ev.enrolled}/${ev.places}</strong></div><div><span>Inscripción</span><strong>${money(ev.price)}</strong></div></div><div class="modal-actions">${button(joined?'Ya estás inscrito':left?'Inscribirme ahora':'Sin cupos','join-event','primary',`data-id="${id}" ${joined||!left?'disabled':''}`)}</div><p class="muted">Inscripción simulada, no se realizan pagos.</p>`);return;}

if(x==='show-notices'){go('notificaciones',state.role==='public'?'cliente':state.role);return;}if(x==='read-all'){db.notifications.filter(z=>z.userId==='u1').forEach(z=>z.read=true);persist();render();return;}if(x==='client-bookings'){go('mis-reservas','cliente');return;}if(x==='client-favorites'){go('favoritos','cliente');return;}if(x==='client-support'){go('soporte','cliente');return;}if(x==='owner-bookings'){go('reservas','propietario');return;}if(x==='owner-venues'){go('sedes','propietario');return;}if(x==='owner-courts'){go('canchas','propietario');return;}if(x==='admin-venues'){go('sedes','administrador');return;}
if(x==='new-venue'||x==='edit-venue'){entityModal('venue',id);return;}if(x==='new-court'||x==='edit-court'){entityModal('court',id);return;}if(x==='new-block'){entityModal('block');return;}if(x==='new-event'||x==='edit-event'){entityModal('event',id);return;}if(x==='new-coupon'){entityModal('coupon');return;}if(x==='new-ticket'){entityModal('ticket');return;}if(x==='walkin-modal'){go('nueva-reserva',state.role);return;}if(x==='delete-block'){if(!confirm('¿Eliminar este bloqueo?'))return;db.blocks=db.blocks.filter(z=>z.id!==id);audit('Bloqueo eliminado',id);render();toast('Bloqueo retirado');return;}
if(x==='agenda-book'){const c=court(id);state.venue=c.venueId;state.court=id;state.date=state.agendaDate;state.slot=a.dataset.time;go('nueva-reserva','operador');return;}if(x==='venue-approval'){const v=venue(id);openModal(`<div class="modal-kicker">SUPERVISIÓN DE SEDES</div><h2>${esc(v.name)}</h2><p class="muted">${esc(v.address)} · Propietario: ${esc(username(v.ownerId))}</p><div class="receipt-details"><div><span>Deportes</span><strong>${esc(v.sports.join(', '))}</strong></div><div><span>Canchas</span><strong>${csOf(v.id).length}</strong></div><div><span>Estado</span>${chip(v.status)}</div></div><div class="modal-actions">${v.status!=='activo'?button('Aprobar publicación','approve-venue','primary',`data-id="${id}"`):button('Suspender sede','suspend-venue','danger',`data-id="${id}"`)}</div>`);return;}if(x==='approve-venue'||x==='suspend-venue'){const v=venue(id);v.status=x==='approve-venue'?'activo':'inactivo';v.verified=x==='approve-venue';audit('Estado de sede cambiado',`${v.name} → ${v.status}`);closeModal();render();toast('Estado actualizado');return;}
if(x==='toggle-coupon'){const z=db.coupons.find(z=>z.id===id);z.active=!z.active;audit('Cupón actualizado',z.code);render();toast('Estado de cupón actualizado');return;}if(x==='user-edit'){const u=db.users.find(z=>z.id===id);openModal(`<div class="modal-kicker">ADMINISTRACIÓN DE USUARIOS</div><h2>${esc(u.name)}</h2><p>${esc(u.email)} · ${esc(u.role)}</p><div class="receipt-details"><div><span>Estado</span>${chip(u.status)}</div><div><span>Registro</span><strong>${pretty(u.joined)}</strong></div></div><div class="modal-actions">${button(u.status==='activo'?'Desactivar usuario':'Activar usuario','toggle-user','outline',`data-id="${id}"`)}</div>`);return;}if(x==='toggle-user'){const u=db.users.find(z=>z.id===id);u.status=u.status==='activo'?'inactivo':'activo';audit('Usuario actualizado',u.name);closeModal();render();toast('Estado del usuario actualizado');return;}
if(x==='ticket-detail'){const t=db.tickets.find(z=>z.id===id);openModal(`<div class="modal-kicker">MESA DE AYUDA · ${esc(t.id)}</div><h2>${esc(t.subject)}</h2><p>${esc(t.detail||'Sin descripción adicional')}</p><div class="receipt-details"><div><span>Usuario</span><strong>${esc(username(t.userId))}</strong></div><div><span>Prioridad</span><strong>${esc(t.priority)}</strong></div><div><span>Estado</span>${chip(t.status)}</div></div>${state.role==='administrador'||state.role==='operador'?`<div class="modal-actions">${button('Marcar resuelto','resolve-ticket','primary',`data-id="${id}"`)}</div>`:''}`);return;}if(x==='resolve-ticket'){db.tickets.find(z=>z.id===id).status='resuelto';audit('Incidencia resuelta',id);closeModal();render();toast('Ticket resuelto');return;}}
function changeAction(e){const el=e.target;if(el.id==='role-selector'){roleChange(el.value);return;}if(el.dataset.filter){state[el.dataset.filter]=el.value;render();return;}if(el.dataset.book){state[el.dataset.book]=el.dataset.book==='duration'?+el.value:el.value;if(el.dataset.book!=='duration'&&el.dataset.book!=='date')state.venue=court(state.court)?.venueId||state.venue;state.slot='';render();return;}if(el.dataset.agenda){state.agendaDate=el.value;render();return;}}
function keyHandler(e){if(e.key==='Escape'&&state.modal)closeModal();}
document.addEventListener('click',handleClick);
document.addEventListener('change',changeAction);
document.addEventListener('input',e=>{if(e.target.dataset.filter==='search'){state.search=e.target.value;const cursor=e.target.selectionStart;render();const n=document.querySelector('input[data-filter="search"]');if(n){n.focus();n.setSelectionRange(cursor,cursor);}}});
document.addEventListener('submit',e=>{if(e.target.id==='review-form'){e.preventDefault();const v=formValues(e.target),b=db.bookings.find(x=>x.id===e.target.dataset.id);db.reviews.push({id:Store.uid('rv'),venueId:b.venueId,userId:'u1',rating:+v.rating,comment:v.comment,date:day()});audit('Reseña publicada',venue(b.venueId)?.name);closeModal();render();toast('Reseña publicada');return;}formAction(e);});
document.addEventListener('keydown',keyHandler);
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(['inicio','explorar','eventos','como-funciona'].includes(p))go(p,'public');});
if(['inicio','explorar','eventos','como-funciona'].includes(location.hash.slice(1)))state.page=location.hash.slice(1);
render();
})();

</script>
</body>
</html>
