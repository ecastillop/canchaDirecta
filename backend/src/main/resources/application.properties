# ============================================================================
# CanchaDirecta - configuracion del backend (perfiles dev/test/prod)
# Los valores sensibles se inyectan por variables de entorno / .env (nunca en Git).
# ============================================================================

quarkus.http.port=${QUARKUS_HTTP_PORT:8088}
quarkus.http.host=0.0.0.0
# Puerto aleatorio en tests para no chocar con otros servicios locales
%test.quarkus.http.test-port=0
quarkus.application.name=canchadirecta
quarkus.banner.enabled=false

# --- CORS (solo desarrollo; en prod va tras el proxy de Nginx) ----------------
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost:8088
%dev.quarkus.http.cors.methods=GET,POST,PATCH,PUT,DELETE,OPTIONS
%dev.quarkus.http.cors.headers=accept,authorization,content-type,idempotency-key
%dev.quarkus.http.cors.access-control-allow-credentials=true

# --- Datasource principal (usuario de RUNTIME, permisos minimos DML) ---------
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USER:canchadirecta_app}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:canchadirecta}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&rewriteBatchedStatements=true
# Nunca arrancar contenedores Dev Services: se usa el MySQL real del proyecto.
quarkus.datasource.devservices.enabled=false

# --- Flyway: dueno del esquema. Usa el usuario de MIGRACION (DDL) ------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.clean-disabled=true
quarkus.flyway.username=${DB_MIG_USER:canchadirecta_mig}
quarkus.flyway.password=${DB_MIG_PASSWORD:}
quarkus.flyway.locations=db/migration

# Hibernate ORM: el esquema lo gestiona Flyway; Hibernate solo valida.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false

# --- OpenAPI / Swagger -------------------------------------------------------
# La documentacion de la API forma parte de la entrega, asi que se publica tambien
# en el perfil `prod` (que es el que usa el contenedor). En un despliegue publico
# real conviene poner `%prod.quarkus.swagger-ui.always-include=false` y `%prod.quarkus.smallrye-openapi.always-include=false`,
# o proteger ambas rutas con autenticacion (ver docs/SEGURIDAD.md).
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=CanchaDirecta API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=API de reserva de canchas deportivas: identidad, catalogo, reservas, pagos simulados, liquidaciones, resenas y administracion.
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.always-include=true

# --- JWT: firma (emision) y verificacion (HS256, clave simetrica local) ------
# La clave vive en un JWK en .secrets/ (gitignored); su ruta llega por entorno.
smallrye.jwt.sign.key.location=${JWT_SIGN_KEY_LOCATION}
smallrye.jwt.new-token.issuer=canchadirecta
# Vigencia del token de acceso: 30 minutos
smallrye.jwt.new-token.lifespan=1800
mp.jwt.verify.issuer=canchadirecta
mp.jwt.verify.publickey.location=${JWT_SIGN_KEY_LOCATION}
mp.jwt.verify.publickey.algorithm=HS256
# Vigencia del refresh token (dias)
cd.auth.refresh-days=30
# Vigencia del enlace de recuperacion de contrasena (minutos)
cd.auth.reset-minutes=30
# Vigencia del enlace de verificacion de correo (minutos)
cd.auth.verify-minutes=1440
# CU01.2: bloquear login de cuentas sin correo verificado (off en el demo: envio simulado)
cd.auth.requerir-correo-verificado=false
# S-4: intentos fallidos de login antes de bloquear temporalmente
cd.auth.login-max-intentos=5
cd.auth.login-bloqueo-min=5

# --- Reservas --------------------------------------------------------------
# Ventana maxima de anticipacion con la que se puede crear una reserva.
cd.reservas.dias-anticipacion-max=365
# Zona de operacion: la fecha de `disponibilidad` se interpreta en esta zona.
cd.zona-horaria=America/Lima
# Ventana de atencion por defecto (hora local) cuando la cancha no tiene filas
# activas en `horario_cancha` para ese dia. El modulo de horarios del propietario
# todavia no existe (docs/LIMITACIONES_CONOCIDAS.md).
cd.reservas.ventana-defecto-inicio=06:00
cd.reservas.ventana-defecto-fin=23:00
# Antelacion minima (horas) para que el titular pueda cancelar su reserva.
cd.reservas.horas-minimas-cancelacion=2
# Hold de pago por defecto (minutos): una solicitud PENDIENTE sin pago aprobado que
# supere esta antiguedad expira. Se usa cuando el establecimiento no tiene fila en
# `config_establecimiento`; si la tiene, prevalece su `hold_pago_min` (ADR-0022).
cd.reservas.hold-pago-min=10
# Maximo de reservas que expira cada ejecucion del job (acota el lote por transaccion).
cd.reservas.expiracion-lote-max=200
# Maximo de reservas confirmadas que cierra cada ejecucion del job de finalizacion
# (acota el lote por transaccion; L-15).
cd.reservas.finalizacion-lote-max=200
# En tests los jobs (expiracion del hold y cierre de reservas concluidas) no se disparan
# por temporizador: cada prueba invoca su caso de uso de forma directa y determinista
# (ADR-0022).
%test.quarkus.scheduler.enabled=false

# --- Pagos simulados (F05) --------------------------------------------------
# Pasarela externa deshabilitada: simulador local determinista (ADR-0020).
# Ventana de cancelacion gratuita (horas antes del inicio) dentro de la cual la
# cancelacion del titular genera reembolso total; fuera de ella no hay reembolso.
cd.pagos.horas-cancelacion-gratis=24

# --- Liquidaciones (F05) ----------------------------------------------------
# Comision de plataforma (%) que se descuenta al propietario al liquidar el ingreso
# de una reserva pagada (default funcional 10 %, REQUISITOS §6).
cd.liquidaciones.porcentaje-comision=10
# Notificador simulado: registra el token en el log para poder completar el flujo
# manualmente. Poner en false si hay un proveedor de correo real (ver docs/SEGURIDAD.md).
cd.notificaciones.registrar-token-en-log=true

# --- Logging estructurado ----------------------------------------------------
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
%prod.quarkus.log.console.json=true

# --- Zona horaria de operacion (se configura en ObjectMapper custom, ver ADR-0008) ---
